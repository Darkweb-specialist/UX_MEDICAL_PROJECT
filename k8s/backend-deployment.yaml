apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicare-backend-deployment
  labels:
    app: medicare-backend
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medicare-backend
  template:
    metadata:
      labels:
        app: medicare-backend
    spec:
      containers:
        - name: medicare-backend
          image: medicare-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "production"
            - name: DB_PATH
              value: "/data/medicare.sqlite"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: db-storage
              mountPath: /data
      volumes:
        - name: db-storage
          emptyDir: {}
